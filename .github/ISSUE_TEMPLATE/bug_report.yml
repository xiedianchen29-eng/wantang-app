name: 问题报告
description: 记录可以重复出现的错误或异常
title: "[问题] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题表现
      description: 实际发生了什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 重现步骤
      description: 按顺序写出如何再次看到问题。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      description: 正常情况下应该发生什么？
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 手机型号、系统版本、App 版本和网络情况。
